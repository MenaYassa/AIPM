discovery:
  ignore_dirs:
  - node_modules
  - .git
  - venv
  - aipm  # Add this so AIPM doesn't scan itself!
  - .venv # Add this to ignore virtual environments
  search_paths:
  - /home/ubuntu/workspace
  - /home/ubuntu/docker
  - /home/ubuntu/projects
  - /home/ubuntu          # <--- Add your home directory
logging:
  backup_count: 3
  file: logs/aipm.log
  level: INFO
  max_size_mb: 10
telemetry:
  enabled: true
  interval_seconds: 15
  resource_sampling_enabled: true
  resource_interval_seconds: 60
  resource_timeout_seconds: 15
  resource_stale_after_seconds: 180
  project_interval_seconds: 60
  project_timeout_seconds: 15
  slow_task_max_concurrency: 1
  sampling_mode: split
  retention_days: 1
  database_path: ~/.local/state/aipm/telemetry/mission_control.db
events:
  enabled: true
  interval_seconds: 15
  event_retention_days: 30
  incident_retention_days: 180
  acknowledgement_enabled: true

notifications:
  enabled: false
  interval_seconds: 5
  retention_days: 180
  default_cooldown_seconds: 900
  default_window_seconds: 3600
  default_max_notifications: 3
  global_window_seconds: 3600
  global_max_notifications: 100
  channels:
  - id: ops-telegram
    name: Operations Telegram
    channel_type: telegram
    enabled: false
    secret_ref: AIPM_NOTIFY_TELEGRAM_TOKEN
    destination_ref: AIPM_NOTIFY_TELEGRAM_CHAT_ID
    timeout_seconds: 10
    max_attempts: 3
  policies:
  - id: critical-incidents
    name: Critical incident openings
    enabled: false
    minimum_severity: critical
    transitions:
    - incident_opened
    - incident_escalated
    notify_recovery: true
    notify_acknowledgement: false
    notify_updates: false
    cooldown_seconds: 900
    window_seconds: 3600
    max_notifications: 3
    channels:
    - ops-telegram
